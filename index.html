<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Piloto QR · Ubicación</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --navy:#0f2540;
    --navy-2:#16375c;
    --accent:#3b82f6;
    --ok:#1a9c6d;
    --warn:#c0392b;
    --bg:#f4f6f9;
    --card:#ffffff;
    --ink:#1b2733;
    --muted:#6b7a8c;
    --border:#e1e6ec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:40px;
  }
  header{
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff; padding:18px 16px 16px; position:sticky; top:0; z-index:10;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header h1{margin:0; font-size:17px; font-weight:700; letter-spacing:.2px;}
  header p{margin:4px 0 0; font-size:12px; color:#b9c8dc;}
  .wrap{max-width:480px; margin:0 auto; padding:14px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(20,30,50,.05);
  }
  .card h2{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 10px;}
  #reader{width:100%; border-radius:10px; overflow:hidden; background:#000;}
  .btn{
    display:block; width:100%; text-align:center; padding:13px 14px; border:none;
    border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-outline{background:#fff; border:1px solid var(--border); color:var(--ink);}
  .btn-ok{background:var(--ok); color:#fff;}
  .btn:disabled{opacity:.5;}
  label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin:10px 0 4px;}
  input,select,textarea{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--border);
    font-size:15px; background:#fbfcfd; color:var(--ink);
  }
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  .interno-banner{
    background:#eef4ff; border:1px solid #cfe0ff; border-radius:10px; padding:12px;
    font-size:14px; margin-bottom:4px;
  }
  .interno-banner b{font-size:18px; color:var(--navy);}
  .veh-confirm{
    background:#e8f7f0; border:1px solid #bfe9d6; border-radius:10px; padding:10px 12px;
    font-size:13.5px; margin-bottom:10px; color:#146c4d;
  }
  .veh-confirm b{color:var(--navy);}
  .badge{
    display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;
    background:#e9edf2; color:var(--muted); margin-left:6px; vertical-align:middle;
  }
  .status{font-size:13px; margin-top:10px; padding:10px 12px; border-radius:9px; display:none;}
  .status.ok{display:block; background:#e8f7f0; color:var(--ok); border:1px solid #bfe9d6;}
  .status.err{display:block; background:#fdecea; color:var(--warn); border:1px solid #f5c6c0;}
  .status.pending{display:block; background:#eef4ff; color:var(--accent); border:1px solid #cfe0ff;}
  .hist{font-size:12.5px; border-bottom:1px solid var(--border); padding:8px 0; display:flex; justify-content:space-between; gap:8px;}
  .hist:last-child{border-bottom:none;}
  .hist .h-int{font-weight:700; color:var(--navy);}
  .hist .h-meta{color:var(--muted);}
  .hidden{display:none !important;}
  .link-btn{background:none; border:none; color:var(--accent); font-size:12.5px; text-decoration:underline; padding:0; cursor:pointer;}
  .cfg-note{font-size:11.5px; color:var(--muted); margin-top:6px;}
</style>
</head>
<body>

<header>
  <h1>Piloto QR · Ubicación en predio</h1>
  <p>Movimiento 0km — carga rápida de posición por interno</p>
</header>

<div class="wrap">

  <!-- CONFIG (solo primera vez) -->
  <div class="card" id="cfgCard">
    <h2>Configuración</h2>
    <label for="scriptUrl">URL del Web App (Apps Script)</label>
    <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
    <button class="btn btn-primary" id="saveCfg">Guardar</button>
    <p class="cfg-note">Se guarda solo en este teléfono. Lo pedís una vez.</p>
  </div>

  <!-- SCANNER -->
  <div class="card hidden" id="scanCard">
    <h2>Escanear QR del auto</h2>
    <div id="reader"></div>
    <button class="btn btn-outline" id="stopScan">Detener cámara</button>
    <button class="btn btn-outline" id="manualBtn">No lee el QR — cargar interno a mano</button>
  </div>

  <!-- START -->
  <button class="btn btn-primary hidden" id="startScan">📷 Escanear auto</button>

  <!-- FORM -->
  <div class="card hidden" id="formCard">
    <h2>Datos de ubicación <span class="badge" id="sourceBadge">QR</span></h2>
    <div class="interno-banner">
      Interno: <b id="internoView">—</b>
      <button class="link-btn" id="editInterno" style="float:right;">editar</button>
    </div>
    <div class="veh-confirm hidden" id="vehConfirm"></div>
    <input type="text" id="internoInput" class="hidden" placeholder="Ej: 4521">

    <label for="sector">Sector</label>
    <select id="sector">
      <option>Movimientos</option>
      <option>Lavadero</option>
      <option>Alistaje</option>
      <option>Usados</option>
    </select>

    <div class="row">
      <div>
        <label for="dique">Dique</label>
        <input type="text" id="dique" placeholder="Ej: D3">
      </div>
      <div>
        <label for="fila">Fila</label>
        <input type="text" id="fila" placeholder="Ej: 7">
      </div>
      <div>
        <label for="columna">Columna</label>
        <input type="text" id="columna" placeholder="Ej: 2">
      </div>
    </div>

    <label for="notas">Notas (opcional)</label>
    <textarea id="notas" rows="2" placeholder="Ej: contacto flojo, requiere revisión"></textarea>

    <button class="btn btn-ok" id="submitBtn">Guardar ubicación</button>
    <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
    <div class="status" id="status"></div>
  </div>

  <!-- HISTORY -->
  <div class="card" id="histCard">
    <h2>Últimas cargas (este teléfono)</h2>
    <div id="histList"><p style="font-size:12.5px;color:var(--muted);margin:0;">Todavía no cargaste ninguna.</p></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let html5QrCode = null;
let scannedRaw = "";
let datosVehActual = {};

// ---------- Config ----------
function getUrl(){ return localStorage.getItem('qr_script_url') || ''; }
function setUrl(u){ localStorage.setItem('qr_script_url', u); }

function refreshCfgUI(){
  const url = getUrl();
  if(url){
    $('cfgCard').classList.add('hidden');
    $('startScan').classList.remove('hidden');
    $('scriptUrl').value = url;
  } else {
    $('cfgCard').classList.remove('hidden');
    $('startScan').classList.add('hidden');
  }
}
$('saveCfg').onclick = () => {
  const v = $('scriptUrl').value.trim();
  if(!v){ alert('Pegá la URL del Web App primero.'); return; }
  setUrl(v);
  refreshCfgUI();
};

// ---------- History (local, solo referencia) ----------
function getHist(){ return JSON.parse(localStorage.getItem('qr_hist') || '[]'); }
function pushHist(item){
  const h = getHist();
  h.unshift(item);
  localStorage.setItem('qr_hist', JSON.stringify(h.slice(0,15)));
  renderHist();
}
function renderHist(){
  const h = getHist();
  const el = $('histList');
  if(h.length === 0){
    el.innerHTML = '<p style="font-size:12.5px;color:var(--muted);margin:0;">Todavía no cargaste ninguna.</p>';
    return;
  }
  el.innerHTML = h.map(r => `
    <div class="hist">
      <span class="h-int">${r.interno}</span>
      <span class="h-meta">${r.sector} · ${r.dique||'-'}/${r.fila||'-'}/${r.columna||'-'} · ${r.time}</span>
    </div>`).join('');
}

// ---------- Extraer datos del QR ----------
// El QR de los autos trae un JSON: {"Mar":"VOLKSWAGEN","NroInt":124489,"Modelo":"TERA",...}
// Si no es JSON válido (u otro formato de QR), cae al modo texto plano de antes.
function extraerDatosQR(texto){
  try{
    const obj = JSON.parse(texto);
    if(obj && obj.NroInt){
      return {
        interno: String(obj.NroInt),
        marca: obj.Mar || '',
        modelo: obj.Modelo || '',
        tipo: (obj.TipoVehiculo || '').trim()
      };
    }
  } catch(e){ /* no era JSON, seguimos con el fallback */ }

  const soloDigitos = texto.trim().match(/\d{3,}/);
  return { interno: soloDigitos ? soloDigitos[0] : texto.trim() };
}

// ---------- Scanner ----------
function iniciarCamara(){
  $('scanCard').classList.remove('hidden');
  $('startScan').classList.add('hidden');
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 240, height: 240 } },
    (decodedText) => {
      scannedRaw = decodedText;
      pararCamara();
      const datos = extraerDatosQR(decodedText);
      abrirFormulario(datos.interno, 'QR', datos);
    },
    () => {}
  ).catch(err => {
    alert('No se pudo abrir la cámara. Revisá permisos, o cargá el interno a mano.');
    console.error(err);
  });
}
function pararCamara(){
  if(html5QrCode){
    html5QrCode.stop().catch(()=>{});
  }
  $('scanCard').classList.add('hidden');
}
$('startScan').onclick = iniciarCamara;
$('stopScan').onclick = () => { pararCamara(); $('startScan').classList.remove('hidden'); };
$('manualBtn').onclick = () => {
  pararCamara();
  abrirFormulario('', 'manual');
};

// ---------- Formulario ----------
function abrirFormulario(interno, origen, datosVeh){
  $('formCard').classList.remove('hidden');
  $('internoView').textContent = interno || '(sin definir)';
  $('internoInput').value = interno;
  $('sourceBadge').textContent = origen === 'QR' ? 'QR' : 'Manual';
  $('status').className = 'status';
  $('status').textContent = '';

  const vc = $('vehConfirm');
  datosVehActual = datosVeh || {};
  if(datosVeh && (datosVeh.marca || datosVeh.modelo)){
    vc.innerHTML = `✓ Auto detectado: <b>${datosVeh.marca}${datosVeh.modelo ? ' ' + datosVeh.modelo : ''}</b>${datosVeh.tipo ? ' · ' + datosVeh.tipo : ''}`;
    vc.classList.remove('hidden');
  } else {
    vc.classList.add('hidden');
  }
}
$('editInterno').onclick = () => {
  $('internoInput').classList.toggle('hidden');
  $('internoInput').focus();
};
$('internoInput').oninput = () => { $('internoView').textContent = $('internoInput').value || '(sin definir)'; };

$('cancelBtn').onclick = () => {
  $('formCard').classList.add('hidden');
  $('startScan').classList.remove('hidden');
};

$('submitBtn').onclick = async () => {
  const interno = $('internoInput').value.trim();
  const sector = $('sector').value;
  const dique = $('dique').value.trim();
  const fila = $('fila').value.trim();
  const columna = $('columna').value.trim();
  const notas = $('notas').value.trim();

  if(!interno){ alert('Falta el interno.'); return; }

  const payload = {
    interno, sector, dique, fila, columna, notas,
    marca: datosVehActual.marca || '',
    modelo: datosVehActual.modelo || '',
    tipo: datosVehActual.tipo || '',
    qr_raw: scannedRaw,
    timestamp: new Date().toISOString()
  };

  $('status').className = 'status pending';
  $('status').textContent = 'Enviando...';
  $('submitBtn').disabled = true;

  try{
    await fetch(getUrl(), {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    $('status').className = 'status ok';
    $('status').textContent = '✓ Guardado';
    pushHist({
      interno, sector, dique, fila, columna,
      time: new Date().toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit'})
    });
    setTimeout(() => {
      $('formCard').classList.add('hidden');
      $('startScan').classList.remove('hidden');
      $('dique').value=''; $('fila').value=''; $('columna').value=''; $('notas').value='';
      $('submitBtn').disabled = false;
    }, 900);
  } catch(err){
    $('status').className = 'status err';
    $('status').textContent = 'Error de red. Revisá conexión y probá de nuevo.';
    $('submitBtn').disabled = false;
    console.error(err);
  }
};

refreshCfgUI();
renderHist();
</script>
</body>
</html>
